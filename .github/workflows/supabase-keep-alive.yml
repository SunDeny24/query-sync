name: supabase-keep-alive
on:
  schedule:
    # 매일 한국 시간(KST) 새벽 4:00에 실행되도록 설정 (UTC 19:00)
    - cron: "0 19 * * *"
  workflow_dispatch: # GitHub 대시보드 수동 실행버튼 활성화
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase
        run: |
          # queryMaster 테이블에서 ID를 딱 1건만 조회하여 확실한 DB 액티비티를 발생시킵니다.
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/queryMaster?select=ID&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
